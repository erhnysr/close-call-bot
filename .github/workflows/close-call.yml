name: close-call-bot

# Zincir: her çalıştırma bitince "chain-wait" ortamında 9 dk bekler (bekleme dakika harcamaz),
# sonra bir sonraki çalıştırmayı kendisi başlatır. Schedule sadece zincir koparsa yedek.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: close-call-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Key'leri secret'tan aç
        env:
          KEYS_B64: ${{ secrets.CLOSE_CALL_KEYS }}
        run: |
          mkdir -p keys
          echo "$KEYS_B64" | base64 -d | tar -xz -C keys
          echo "key sayısı: $(ls keys/*.json | wc -l)"

      - name: Bir adım çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node close-call-bot.mjs tick --step 4 --hours 24

      - name: Durumu kaydet
        if: always()
        run: |
          rm -rf keys
          git config user.name "close-call-bot"
          git config user.email "close-call-bot@users.noreply.github.com"
          git add bot-state.json
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
          exit 1

  next:
    needs: tick
    if: always()
    runs-on: ubuntu-latest
    environment: chain-wait
    timeout-minutes: 3
    steps:
      - name: Sonraki çalıştırmayı başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d 2026-10-04T09:05:00Z +%s)" ]; then
            echo "Kilit geçti, zincir durduruldu."; exit 0
          fi
          gh workflow run close-call.yml --repo "$GITHUB_REPOSITORY" --ref main
